name: Pull request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  tests:
    name: Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test

  cloudflare-build:
    name: Cloudflare build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PREVIEW_PUBLISHABLE_KEY }}
      DEPLOYMENT_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:cf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-next-${{ github.sha }}
          path: .open-next
          include-hidden-files: true
          retention-days: 1

  preview-e2e:
    name: Preview E2E
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [tests, cloudflare-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DB_NAME: arcazzi-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: open-next-${{ github.sha }}
          path: .open-next
      - name: Reuse or create preview database
        id: database
        run: |
          database_id="$(bunx wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid')"
          if [ -z "$database_id" ]; then
            bunx wrangler d1 create "$DB_NAME" --location weur
            database_id="$(bunx wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid')"
          fi
          test -n "$database_id"
          echo "database-id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Configure and migrate preview database
        run: |
          bunx rimraf drizzle_flat
          bun run db:flatten
          bun run write-preview-wrangler "$DB_NAME" "${{ steps.database.outputs.database-id }}" wrangler-preview.json
          bunx wrangler d1 migrations apply DB --remote --config wrangler-preview.json
      - name: Upload preview version
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/preview-secrets.json"
          trap 'rm -f "$secrets_file" wrangler-preview.json' EXIT
          jq -n --arg key "$CLERK_SECRET_KEY" '{CLERK_SECRET_KEY: $key}' > "$secrets_file"
          bun run upload:cf --config wrangler-preview.json -- --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER at $GITHUB_SHA" --tag "$GITHUB_SHA" --secrets-file "$secrets_file"
      - name: Publish preview URL
        id: preview
        run: echo "url=https://pr-$PR_NUMBER-arcazzi.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Run remote Playwright suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_CLERK_EMAIL: ${{ secrets.E2E_CLERK_EMAIL }}
        run: bun run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  cleanup-preview:
    name: Cleanup preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: arcazzi-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Delete preview database when present
        run: |
          database_id="$(bunx wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid')"
          if [ -n "$database_id" ]; then
            bunx wrangler d1 delete "$database_id" --skip-confirmation
          fi
