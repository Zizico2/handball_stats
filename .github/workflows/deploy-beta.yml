name: Deploy beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy beta
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: beta
      url: https://arcazzi.bernardobordadagua.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      DEPLOYMENT_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .next/cache
          key: next-beta-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-beta-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run cf:build
      - name: Migrate beta database
        run: |
          bunx rimraf drizzle_flat
          bun run db:flatten
          bunx wrangler d1 migrations apply arcazzi --remote
      - name: Deploy exact build
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/beta-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg key "$CLERK_SECRET_KEY" '{CLERK_SECRET_KEY: $key}' > "$secrets_file"
          OPEN_NEXT_DEPLOY=true bunx wrangler versions upload \
            --preview-alias beta-smoke \
            --message "Beta $GITHUB_SHA" \
            --tag "$GITHUB_SHA" \
            --secrets-file "$secrets_file"
          version_id="$(bunx wrangler versions list --json | jq -r --arg tag "$GITHUB_SHA" '[.[] | select(.annotations["workers/tag"] == $tag)] | last | .id')"
          test -n "$version_id"
          bunx wrangler versions deploy "$version_id@100%" --yes --message "Beta $GITHUB_SHA"
      - name: Smoke test beta
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://beta-smoke-arcazzi.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/
